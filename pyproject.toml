[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "databolt-standard-patterns"
dynamic = ["version"]
description = "Open-source ingestion patterns (databolt.ingestion.api) for the DataBolt data platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "DataBlock Labs" }]
keywords = ["databolt", "ingestion", "rest", "api", "etl", "elt", "pagination", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "httpcore>=1.0,<2",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
duckdb = ["duckdb>=1.0"]
all = ["databolt-standard-patterns[parquet,duckdb]"]
dev = [
  "databolt-standard-patterns[all]",
  "pytest>=8",
  "pytest-httpserver>=1.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
databolt-patterns = "databolt.patterns.cli:main"

[project.urls]
Homepage = "https://github.com/DataBlock-Labs/databolt-standard-patterns"
Documentation = "https://github.com/DataBlock-Labs/databolt-standard-patterns/tree/main/docs"
Issues = "https://github.com/DataBlock-Labs/databolt-standard-patterns/issues"
Changelog = "https://github.com/DataBlock-Labs/databolt-standard-patterns/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/databolt/patterns/_version.py"

# `databolt` is a PEP 420 namespace package: no dist may ship databolt/__init__.py
# (or databolt/ingestion/__init__.py). CI fails the build if one appears in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/databolt"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "examples/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "ARCHITECTURE.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "RET"]
ignore = [
  "S101",   # assert is fine in tests and for type narrowing
  "RUF001", # ambiguous unicode in strings (docs use typographic quotes)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["databolt"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
packages = ["databolt"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb", "pytest_httpserver", "pytest_httpserver.*", "werkzeug.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: hits real public APIs (PokeAPI, USGS); opt in with `-m live`",
]
