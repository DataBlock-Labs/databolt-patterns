name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.ZaN`) to build, attach the artifacts to a GitHub
# release, then publish to TestPyPI and PyPI through trusted publishing.
#
# Publishing is gated on the repository variable PYPI_PUBLISH == "true". Until the
# one-time trusted-publisher setup in RELEASING.md is done and that variable is
# set, a tag still builds and creates the GitHub release; the publish jobs are
# skipped instead of failing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Tag must match the package version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'\"(.+)\"', pathlib.Path('src/databolt/patterns/_version.py').read_text()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*) flags="$flags --prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" $flags

  publish-gate:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: |
          if [ "${PYPI_PUBLISH}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PyPI publishing skipped: set the repository variable PYPI_PUBLISH=true after the trusted-publisher setup in RELEASING.md"
          fi

  testpypi:
    needs: [build, publish-gate]
    if: needs.publish-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/databolt-standard-patterns
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: [testpypi, publish-gate]
    if: needs.publish-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/databolt-standard-patterns
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
